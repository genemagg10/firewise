<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <style>
    #twinkle{transform-box:fill-box;transform-origin:center;animation:twinkle 4s ease-in-out infinite}
    @keyframes twinkle{0%,70%,100%{transform:scale(1);opacity:.95}80%{transform:scale(1.5) rotate(20deg);opacity:1}90%{transform:scale(.7);opacity:.6}}
    @media (prefers-reduced-motion:reduce){#twinkle{animation:none}}
  </style>
  <defs>
    <radialGradient id="bg" cx="50%" cy="46%" r="62%">
      <stop offset="0" stop-color="#329566"/>
      <stop offset=".6" stop-color="#22603f"/>
      <stop offset="1" stop-color="#173b2b"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="58%" r="45%">
      <stop offset="0" stop-color="#ffb347" stop-opacity=".45"/>
      <stop offset="1" stop-color="#ffb347" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="fl" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe14d"/>
      <stop offset=".38" stop-color="#ffa323"/>
      <stop offset=".72" stop-color="#ff6a1f"/>
      <stop offset="1" stop-color="#e3261b"/>
    </linearGradient>
    <linearGradient id="core" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff7b0"/>
      <stop offset="1" stop-color="#ffcf3a"/>
    </linearGradient>
    <linearGradient id="leaf" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5fe3bf"/>
      <stop offset="1" stop-color="#17a585"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="100" fill="url(#bg)"/>
      <g id="flame" transform="translate(-6 10) scale(1.0)">
    <path d="M256 448C170 448 118 390 122 318C125 266 152 232 174 200C180 232 192 252 214 262C204 206 222 150 268 104C288 84 300 66 306 44C322 92 316 132 332 168C342 190 360 204 368 178C372 166 372 152 370 138C402 176 398 224 392 260C410 240 414 214 416 196C434 232 434 278 424 320C406 396 342 448 256 448Z" fill="url(#fl)" stroke="#5a1a0c" stroke-width="26" stroke-linejoin="round"/>
    <path d="M258 420C212 420 186 390 188 352C190 318 214 296 230 270C236 292 246 304 262 308C262 276 276 250 296 228C302 262 330 282 330 330C330 384 300 420 258 420Z" fill="url(#core)"/>
    <!-- wink highlight -->
    <path d="M190 262C198 240 212 226 230 218" fill="none" stroke="#fff" stroke-opacity=".9" stroke-width="18" stroke-linecap="round"/>
    <path id="twinkle" d="M176 272Q178 286 192 288Q178 290 176 304Q174 290 160 288Q174 286 176 272Z" fill="#fff" fill-opacity=".95"/>
  </g>
  <g transform="translate(150 418) rotate(-30) scale(1.3)">
    <path d="M-74 0 L-62 -4 C-70 -44 -16 -44 -24 -12 C-32 -50 22 -50 14 -12 C6 -40 56 -40 48 -8 C58 -30 80 -12 82 0 C80 12 58 30 48 8 C56 40 6 40 14 12 C22 50 -32 50 -24 12 C-16 44 -70 44 -62 4 Z" fill="url(#leaf)" stroke="#0b4536" stroke-width="16" stroke-linejoin="round"/>
    </g>
</svg>
